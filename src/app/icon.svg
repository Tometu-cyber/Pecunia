<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Icône de Pecunia : AppIcon « finances » du design system (design-system/components/AppIcon),
     portefeuille en verre sur un dégradé de la couleur finances. Apparence sombre d'iOS 26 en thème sombre. -->
<style>
  :root { --bg1: #7dd88a; --bg2: #249340; --fg1: #ffffff; --fg2: rgba(255, 255, 255, 0.8); --back: rgba(255, 255, 255, 0.48); --detail: #16672b; --sheen: 0.9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg1: #3a3a3e; --bg2: #121214; --fg1: #82e08e; --fg2: #30d158; --back: rgba(48, 209, 88, 0.45); --detail: rgba(0, 0, 0, 0.5); --sheen: 0.22; }
  }
  .bg1 { stop-color: var(--bg1); } .bg2 { stop-color: var(--bg2); }
  .fg1 { stop-color: var(--fg1); } .fg2 { stop-color: var(--fg2); }
  .back { fill: var(--back); } .detail { fill: var(--detail); } .sheen { opacity: var(--sheen); }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient>
  <radialGradient id="sh" cx="0.3" cy="0.05" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <linearGradient id="fg" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" class="fg1"/><stop offset="1" class="fg2"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.3" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.75" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.18"/></linearGradient>
  <filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#000000" flood-opacity="0.24"/></filter>
</defs>
<path d="M0 50C0 9 9 0 50 0S100 9 100 50 91 100 50 100 0 91 0 50Z" fill="url(#bg)" />
<path d="M0 50C0 9 9 0 50 0S100 9 100 50 91 100 50 100 0 91 0 50Z" fill="url(#sh)" class="sheen"/>
<g filter="url(#ds)">
  <rect class="back" x="24" y="24" width="50" height="32" rx="7" transform="rotate(-12 49 40)"/>
  <rect fill="url(#fg)" x="20" y="36" width="60" height="40" rx="10"/>
  <rect class="detail" x="56" y="48" width="24" height="16" rx="8"/>
  <circle fill="url(#fg)" cx="64" cy="56" r="3.6"/>
</g>
<path d="M0 50C0 9 9 0 50 0S100 9 100 50 91 100 50 100 0 91 0 50Z" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
